 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GYANI STORE • Admin Panel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#070b16;
    color:#fff;
}

.header{
    background:linear-gradient(135deg,#101a3d,#35116b);
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    box-shadow:0 5px 25px #0008;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.store-btn{
    background:#ffffff18;
    border:1px solid #ffffff30;
    padding:11px 16px;
    border-radius:10px;
    color:white;
    text-decoration:none;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#11182b;
    border:1px solid #27345c;
    border-radius:16px;
    padding:20px;
}

.stat span{
    color:#aeb8d5;
    font-size:14px;
}

.stat h2{
    margin-top:10px;
    font-size:30px;
}

/* GRID */

.main-grid{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:20px;
}

/* PANEL */

.panel{
    background:#10172a;
    border:1px solid #28365f;
    border-radius:18px;
    padding:20px;
}

.panel h2{
    margin-bottom:18px;
}

/* FORM */

label{
    display:block;
    color:#b9c3df;
    font-size:14px;
    margin:12px 0 6px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    background:#080e1e;
    border:1px solid #344269;
    color:white;
    border-radius:10px;
    outline:none;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#805cff;
}

/* BUTTONS */

button{
    border:0;
    padding:11px 15px;
    border-radius:10px;
    color:white;
    background:#704cff;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

button:hover{
    opacity:.85;
}

.gray{
    background:#303951;
}

.delete{
    background:#d93656;
}

.edit{
    background:#2468e8;
}

/* TABLE */

.table-box{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th,
td{
    padding:13px;
    text-align:left;
    border-bottom:1px solid #27304b;
    font-size:14px;
}

th{
    color:#aeb9d8;
}

.empty{
    text-align:center;
    padding:30px;
    color:#9da8c5;
}

/* ORDERS */

.orders{
    margin-top:20px;
}

/* MOBILE */

@media(max-width:850px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .main-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){

    .container{
        padding:12px;
    }

    .stats{
        gap:10px;
    }

    .stat{
        padding:15px;
    }

    .stat h2{
        font-size:24px;
    }

    .logo{
        font-size:18px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="logo">
        👑 GYANI STORE • ADMIN
    </div>

    <a href="index.html" class="store-btn">
        🛍️ Open Store
    </a>

</header>


<div class="container">

<!-- DASHBOARD -->

<div class="stats">

    <div class="stat">
        <span>Total Products</span>
        <h2 id="productCount">0</h2>
    </div>

    <div class="stat">
        <span>Total Orders</span>
        <h2 id="orderCount">0</h2>
    </div>

    <div class="stat">
        <span>Cart Items</span>
        <h2 id="cartCount">0</h2>
    </div>

    <div class="stat">
        <span>Store Status</span>
        <h2>● LIVE</h2>
    </div>

</div>


<!-- MAIN -->

<div class="main-grid">

<!-- ADD PRODUCT -->

<section class="panel">

<h2 id="formTitle">➕ Add Product</h2>

<form id="productForm">

<label>Product Name</label>
<input id="name" required placeholder="Enter product name">


<label>Category</label>

<select id="category">

<option>Electronics</option>
<option>Mobile</option>
<option>Audio</option>
<option>Watch</option>
<option>Accessories</option>
<option>Gaming</option>

</select>


<label>Price ₹</label>
<input id="price" type="number" min="0" required>


<label>Old Price ₹</label>
<input id="oldPrice" type="number" min="0">


<label>Discount %</label>
<input id="discount" type="number" min="0" max="100" value="0">


<label>Rating</label>
<input id="rating" type="number" min="0" max="5" step="0.1" value="4.5">


<label>Product Image URL</label>
<input id="image" placeholder="https://example.com/image.jpg">


<label>Description</label>
<textarea id="description"
placeholder="Product description"></textarea>


<button type="submit">
💾 Save Product
</button>

<button type="button"
class="gray"
onclick="resetForm()">
Clear
</button>

</form>

</section>


<!-- PRODUCT MANAGEMENT -->

<section class="panel">

<h2>📦 Product Management</h2>

<div class="table-box">

<table>

<thead>

<tr>
<th>Product</th>
<th>Category</th>
<th>Price</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="productTable"></tbody>

</table>

</div>

</section>

</div>


<!-- ORDERS -->

<section class="panel orders">

<h2>🛒 Customer Orders</h2>

<div class="table-box">

<table>

<thead>

<tr>
<th>Customer</th>
<th>Phone</th>
<th>Address</th>
<th>Total</th>
</tr>

</thead>

<tbody id="orderTable"></tbody>

</table>

</div>

</section>

</div>


<script>

/* STORAGE */

const PRODUCT_KEY = "gyani_store_products";

const ORDER_KEY = "gyani_store_orders";

const CART_KEY = "gyani_store_cart";


/* DEMO PRODUCTS */

const demoProducts = [

{
id:1,
name:"Premium Wireless Headphones",
category:"Audio",
price:1499,
oldPrice:2499,
discount:40,
rating:4.7,
image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80",
description:"Premium wireless headphones."
},

{
id:2,
name:"Smart Watch Pro",
category:"Watch",
price:1999,
oldPrice:2999,
discount:33,
rating:4.6,
image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80",
description:"Modern smart watch."
},

{
id:3,
name:"RGB Gaming Mouse",
category:"Gaming",
price:799,
oldPrice:1299,
discount:38,
rating:4.5,
image:"https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=700&q=80",
description:"RGB gaming mouse."
}

];


/* GET PRODUCTS */

function getProducts(){

let products =
JSON.parse(localStorage.getItem(PRODUCT_KEY));

if(!products){

products = demoProducts;

localStorage.setItem(
PRODUCT_KEY,
JSON.stringify(products)
);

}

return products;

}


/* RENDER */

function render(){

const products = getProducts();

const orders =
JSON.parse(localStorage.getItem(ORDER_KEY) || "[]");

const cart =
JSON.parse(localStorage.getItem(CART_KEY) || "[]");


document.getElementById("productCount")
.innerText = products.length;


document.getElementById("orderCount")
.innerText = orders.length;


let totalCart = 0;

cart.forEach(item=>{
totalCart += item.qty || 1;
});


document.getElementById("cartCount")
.innerText = totalCart;


/* PRODUCTS */

const productTable =
document.getElementById("productTable");


if(products.length === 0){

productTable.innerHTML =
`
<tr>
<td colspan="4" class="empty">
No products found.
</td>
</tr>
`;

}else{

productTable.innerHTML =
products.map(product => `

<tr>

<td>
<strong>${product.name}</strong>
</td>

<td>
${product.category}
</td>

<td>
₹${product.price}
</td>

<td>

<button
class="edit"
onclick="editProduct(${product.id})">
Edit
</button>

<button
class="delete"
onclick="deleteProduct(${product.id})">
Delete
</button>

</td>

</tr>

`).join("");

}


/* ORDERS */

const orderTable =
document.getElementById("orderTable");


if(orders.length === 0){

orderTable.innerHTML =
`
<tr>
<td colspan="4" class="empty">
No orders yet.
</td>
</tr>
`;

}else{

orderTable.innerHTML =
orders.map(order => `

<tr>

<td>${order.name || "-"}</td>

<td>${order.phone || "-"}</td>

<td>${order.address || "-"}</td>

<td>
₹${order.total || 0}
</td>

</tr>

`).join("");

}

}


/* EDIT ID */

let editId = null;


/* SAVE PRODUCT */

document
.getElementById("productForm")
.addEventListener("submit",function(e){

e.preventDefault();


let products = getProducts();


const product = {

id: editId || Date.now(),

name:
document.getElementById("name").value,

category:
document.getElementById("category").value,

price:
Number(document.getElementById("price").value),

oldPrice:
Number(document.getElementById("oldPrice").value) || 0,

discount:
Number(document.getElementById("discount").value) || 0,

rating:
Number(document.getElementById("rating").value) || 0,

image:
document.getElementById("image").value,

description:
document.getElementById("description").value

};


if(editId){

products =
products.map(item =>
item.id === editId
? product
: item
);

}else{

products.push(product);

}


localStorage.setItem(
PRODUCT_KEY,
JSON.stringify(products)
);


resetForm();

render();

alert("Product saved successfully!");

});


/* EDIT */

function editProduct(id){

const product =
getProducts().find(item =>
item.id === id
);

if(!product) return;


editId = id;


document.getElementById("formTitle")
.innerText = "✏️ Edit Product";


document.getElementById("name").value =
product.name;


document.getElementById("category").value =
product.category;


document.getElementById("price").value =
product.price;


document.getElementById("oldPrice").value =
product.oldPrice;


document.getElementById("discount").value =
product.discount;


document.getElementById("rating").value =
product.rating;


document.getElementById("image").value =
product.image;


document.getElementById("description").value =
product.description;


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* DELETE */

function deleteProduct(id){

if(!confirm(
"Are you sure you want to delete this product?"
)) return;


const products =
getProducts().filter(item =>
item.id !== id
);


localStorage.setItem(
PRODUCT_KEY,
JSON.stringify(products)
);


render();

}


/* RESET FORM */

function resetForm(){

editId = null;


document.getElementById("formTitle")
.innerText = "➕ Add Product";


document.getElementById("productForm")
.reset();


document.getElementById("rating").value = 4.5;

document.getElementById("discount").value = 0;

}


/* START */

render();

</script>

</body>
</html>
